[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vtuber-rigger"
version = "0.1.0"
description = "AI auto-rigger for VTuber avatars — 3D model or screenshots → VRM 1.0"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "VTuber Rigger"}]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "trimesh[easy]>=4.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "pygltflib>=1.16",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "diffusers>=0.27",
    "accelerate>=0.20",
    "safetensors>=0.4",
    "scikit-image>=0.22",
    "anime-seg>=0.3",
]
perceptual = [
    "lpips>=0.1",
    "clip-by-openai>=1.0",
    "mediapipe>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "mypy>=1.8",
]

[project.scripts]
vtuber-rigger = "vtuber_rigger.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "ml: marks tests requiring ML models",
    "blender: marks tests requiring Blender",
    "perceptual: marks tests requiring perceptual models",
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true